[package]
name = "zkboo-slhdsa"
version = "1.0.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "SLH-DSA (SPHINCS+, FIPS 205) key generation and verification as ZKBoo circuits."
repository = "https://github.com/zkboo/zkboo-slhdsa"
documentation = "https://docs.rs/zkboo-slhdsa"
readme = "README.md"
keywords = ["zk", "zero-knowledge", "zkboo", "slh-dsa", "sphincs"]
categories = ["cryptography", "no-std"]

[dependencies]
zkboo = { version = "1.0.0", features = ["u16", "u32", "u64"] }
zkboo-keccak = { version = "1.0.0" }
zkboo-sha2 = { version = "1.0.0", features = ["sha256"] }

[dev-dependencies]
zkboo = { version = "1.0.0", features = ["u16", "u32", "u64"] }
blake3 = "1.8.3"
zeroize = "1.8.2"
slh-dsa = "0.1.0"
# slh-dsa 0.1.0 does not compile against later `signature` prereleases, so pin the exact one.
signature = "=2.3.0-pre.4"
rand = "0.8"
serde_json = "1"
